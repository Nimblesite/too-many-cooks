name: CI
# agent-pmo:0b21609

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lint-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    # TIMEOUT EXCEPTION: Full E2E suite spins up MCP server, VSIX, and Playwright; needs more than 10 min.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            too-many-cooks/package-lock.json
            too_many_cooks_vscode_extension/package-lock.json
            website/package-lock.json

      # Same entry points developers run locally — no duplicated steps.
      # make test computes coverage AND enforces coverage-thresholds.json.
      - name: Install dependencies
        run: make setup

      - name: Lint
        run: make lint

      - name: Test (fail-fast + coverage gate)
        uses: coactions/setup-xvfb@v1
        with:
          run: make test

      - name: Build
        run: make build

  # Dependency review ([GITHUB-DEP-REVIEW]) — fails a PR that adds a dependency
  # with known vulnerabilities. Lightweight, PR-only, no special token scopes.
  # CodeQL source scanning is SEPARATE in codeql.yml ([GITHUB-CODE-SCANNING]).
  # The two do NOT overlap with each other or with linting: dependency-review =
  # vulnerable packages, CodeQL = vulnerable code, lint = style/correctness.
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # dependency-review posts its PR summary
    steps:
      - uses: actions/checkout@v7
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
