name: Release

# Tag → release. The tagged SHA is built verbatim: NO branch detection, NO
# commit, NO push, NO tag mutation. Version is stamped runner-local from the tag
# in each build job, BEFORE build/pack. [SWR-VERSION-BUILD-STAMPING]
#
# Shape: scope (what changed) → CodeQL + full CI gate on the tagged SHA → build
# jobs produce ARTIFACTS only (provenance + CycloneDX SBOM attested per artifact)
# → one github-release job publishes them with a cosign-signed SHA256SUMS → the
# registry jobs consume the SAME artifacts, so identical bytes ship everywhere.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

# Least-privilege default: every job is read-only unless it explicitly escalates.
# [SWR-SEC-TOKEN-PRIVILEGE]
permissions:
  contents: read

jobs:
  # [SWR-REL-CHANGES-*] Diff this tag against the previous one. A server change
  # (`binary`) releases everything; an extension-only or website-only change
  # skips the npm publish. Unclassified paths fail safe to a full release.
  scope:
    name: Release scope
    permissions:
      contents: read
    uses: ./.github/workflows/release-change-detection.yml
    with:
      shipwright_rev: 369a32556f44c8db581b5886bc47756d3ad660a4

  # CodeQL release gate ([GITHUB-CODE-SCANNING]). Scans the tagged SHA with the
  # current query set and FAILS on any High/Critical finding, so code CodeQL
  # flagged can never ship. Reuses codeql.yml via workflow_call.
  codeql:
    name: CodeQL release gate
    permissions:
      security-events: write
      actions: read
      contents: read
    uses: ./.github/workflows/codeql.yml
    with:
      gate: true

  # [SWR-REL-WORKFLOW] lint + test (coverage gate) + build + vuln scan +
  # supply-chain lint on the exact tagged SHA, before anything publishes.
  ci:
    name: CI gate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build-mcp:
    name: Build & Publish npm Packages
    runs-on: ubuntu-latest
    needs: [scope, codeql, ci]
    if: needs.scope.outputs.full == 'true'
    environment: NPM Deployment
    permissions:
      contents: read
      id-token: write     # npm Trusted Publisher (OIDC) + Sigstore attestations
      attestations: write # [SWR-SEC-PROVENANCE] [SWR-SEC-SBOM]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 24 bundles npm >= 11.5.1 (required for Trusted Publisher OIDC), so
      # no `npm install -g npm@latest` floats an unpinned npm into the job that
      # publishes. No dependency cache on a publishing job (cache poisoning).
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Require npm >= 11.5.1 (Trusted Publisher OIDC)
        run: |
          set -euo pipefail
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)"

      - name: Set version and npm tag from git tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NPM_TAG=latest
          if [[ "$VERSION" == *-* ]]; then NPM_TAG=beta; fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "NPM_TAG=$NPM_TAG" >> "$GITHUB_OUTPUT"

      # Same stamper release_version_stamp_test.ts and
      # release_stamped_version_reported_test.ts exercise with a test version.
      - name: Stamp versions
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: bash scripts/stamp-version.sh "$VERSION"

      - name: Install dependencies
        working-directory: too-many-cooks
        run: npm ci

      - name: Build all packages
        working-directory: too-many-cooks
        run: npm run build

      - name: Verify builds and --version
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          test -f too-many-cooks/packages/core/build/index.js
          out="$(node too-many-cooks/packages/too-many-cooks/build/bin/server.js --version | head -n1)"
          echo "$out"
          test "$out" = "too-many-cooks ${VERSION}"

      - name: Pack tarballs
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd too-many-cooks/packages/core && npm pack --pack-destination "$GITHUB_WORKSPACE/dist")
          (cd too-many-cooks/packages/too-many-cooks && npm pack --pack-destination "$GITHUB_WORKSPACE/dist")
          ls -l dist

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: too-many-cooks
          format: cyclonedx-json
          output-file: dist/too-many-cooks-${{ steps.version.outputs.VERSION }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tgz

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*.tgz
          sbom-path: dist/too-many-cooks-${{ steps.version.outputs.VERSION }}.cdx.json

      # Publishes the exact attested tarballs. Core first (the server depends on
      # it). Skip-if-published makes a re-run over a released version safe.
      - name: Publish to npm (OIDC, provenance)
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          NPM_TAG: ${{ steps.version.outputs.NPM_TAG }}
        run: |
          set -euo pipefail
          for pkg in too-many-cooks-core too-many-cooks; do
            if npm view "${pkg}@${VERSION}" version >/dev/null 2>&1; then
              echo "${pkg}@${VERSION} already published; skipping"
              continue
            fi
            npm publish "dist/${pkg}-${VERSION}.tgz" --tag "$NPM_TAG" --provenance --access public
          done

      - name: Upload npm artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tarballs
          path: dist/
          if-no-files-found: error

  # [SWR-VSIX-PACKAGE] One VSIX per target, built AND booted on its native
  # runner, contents verified — the same workflow every PR runs. A vsix-only
  # release still rebuilds the server at the new version: the extension checks
  # --version == its own version ([SWR-REL-CHANGES-CONTRACT]).
  build-vsix:
    name: Build VSCode Extensions
    needs: [scope, codeql, ci]
    if: needs.scope.outputs.vsix == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/vsix-platforms.yml
    with:
      version: ${{ github.ref_name }}

  # Attest the four verified packages. The github-release, Marketplace and
  # Open VSX jobs consume THIS `vsix` artifact, so identical, verified bytes
  # ship everywhere.
  verify-vsix:
    name: Attest VSIX packages
    runs-on: ubuntu-24.04
    needs: build-vsix
    permissions:
      contents: read
      id-token: write     # Sigstore attestations
      attestations: write # [SWR-VSIX-PROVENANCE] [SWR-SEC-SBOM]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: vsix-*
          path: dist
          merge-multiple: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install extension dependencies (SBOM input)
        working-directory: too_many_cooks_vscode_extension
        run: npm ci

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/too-many-cooks-vscode-${{ github.ref_name }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.vsix

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*.vsix
          sbom-path: dist/too-many-cooks-vscode-${{ github.ref_name }}.cdx.json

      - name: Upload verified VSIX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vsix
          path: dist/
          if-no-files-found: error

  # Single owner of the GitHub release — no parallel softprops race. Publishes
  # every built artifact plus one cosign keyless-signed SHA256SUMS over them.
  # [SWR-SEC-CHECKSUM]
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-mcp, verify-vsix]
    # A skipped (out-of-scope) build must not skip the release; a failed one must.
    if: >-
      !cancelled()
      && !contains(needs.*.result, 'failure')
      && contains(needs.*.result, 'success')
    permissions:
      contents: write # create the release
      id-token: write # cosign keyless signing
    steps:
      # Only the published sets: the per-target vsix-* intermediates are already
      # inside the verified `vsix` artifact.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '{npm-tarballs,vsix}'
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the Fulcio cert binds the signature to THIS workflow at this tag.
      # Verify immediately, pinned to that identity, so a bad signature fails here.
      - name: Sign and verify SHA256SUMS (cosign keyless)
        working-directory: dist
        env:
          IDENTITY: ^https://github.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity-regexp "$IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS

      - name: Create release with all assets
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: dist/*
          fail_on_unmatched_files: true
          name: Too Many Cooks ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish-marketplace:
    name: Publish VSIX to VS Code Marketplace
    runs-on: ubuntu-latest
    needs: verify-vsix
    # Passwordless publish via Microsoft Entra ID OIDC — NO long-lived PAT.
    # Binding the job to the `release` environment makes the GitHub OIDC subject
    # deterministic (repo:Nimblesite/too-many-cooks:environment:release), so ONE
    # federated credential covers every v* tag — Entra rejects tag wildcards in an
    # explicit federated subject. AZURE_CLIENT_ID / AZURE_TENANT_ID (neither
    # sensitive) live on the `release` environment / org. [SWR-VSIX-PUBLISH-OIDC]
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vsix
          path: artifacts

      # Exchange the GitHub Actions OIDC token for an Entra ID session (no client
      # secret). The publisher identity has no Azure subscription role — its only
      # authorization is Marketplace publisher membership — hence
      # allow-no-subscriptions.
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Mint an Azure DevOps / Marketplace-scoped Entra access token from the OIDC
      # session and hand it to vsce via VSCE_PAT (kept off argv + masked).
      # 499b84ac-1321-427f-aa17-267ca6975798 is Azure DevOps' fixed first-party app
      # id that vsce authenticates against; this explicit short-lived-token path is
      # the reliable PAT-less recipe and sidesteps the `--azure-credential` publish
      # bug (microsoft/vscode-vsce#1023). A hyphenated tag publishes --pre-release.
      # --skip-duplicate makes a re-run over an already-published version idempotent.
      - name: Publish VSIX (Entra OIDC, no PAT)
        shell: bash
        run: |
          set -euo pipefail
          flag=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            flag="--pre-release"
            echo "Prerelease tag ${GITHUB_REF_NAME}; publishing with --pre-release"
          fi
          VSCE_PAT="$(az account get-access-token \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query accessToken -o tsv)"
          echo "::add-mask::${VSCE_PAT}"
          export VSCE_PAT
          published=0
          shopt -s nullglob
          for vsix in artifacts/*.vsix; do
            echo "Publishing ${vsix}"
            npx --yes @vscode/vsce@3.9.2 publish --skip-duplicate ${flag} --packagePath "${vsix}"
            published=$((published + 1))
          done
          if [ "${published}" -eq 0 ]; then
            echo "::error::no VSIX artifacts found to publish"
            exit 1
          fi
          echo "Published ${published} VSIX(es) to the Marketplace"

  publish-openvsx:
    name: Publish VSIX (Open VSX)
    runs-on: ubuntu-latest
    needs: verify-vsix
    # Independent of publish-marketplace: the Open VSX push (which serves the
    # VS Code forks — Cursor, Windsurf, Antigravity) must not be gated on the MS
    # Marketplace publish, and vice versa. Open VSX has no OIDC/trusted-publishing
    # path, so this uses an Open VSX token (OPEN_VSX_PAT) scoped to the release env.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vsix
          path: artifacts

      # ovsx is version-pinned: a floating `npx ovsx` would fetch and run the
      # latest release inside the job that holds the token — a supply-chain risk.
      # --skip-duplicate makes a re-run over an already-published version idempotent.
      - name: Publish to Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "::error::OPEN_VSX_PAT is not set; cannot publish to Open VSX"
            exit 1
          fi
          flag=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            flag="--pre-release"
          fi
          published=0
          shopt -s nullglob
          for vsix in artifacts/*.vsix; do
            echo "Publishing ${vsix}"
            npx --yes ovsx@1.0.0 publish --skip-duplicate ${flag} --packagePath "${vsix}"
            published=$((published + 1))
          done
          if [ "${published}" -eq 0 ]; then
            echo "::error::no VSIX artifacts found to publish"
            exit 1
          fi
          echo "Published ${published} VSIX(es) to Open VSX"

  # Website deploys only after the CodeQL and CI gates pass, so the live site
  # never gets ahead of an unscanned release. Stable tags only: hyphenated SemVer
  # prerelease tags (v0.14.0-rc.1, …) never overwrite the live site.
  deploy-website:
    name: Deploy Website to GitHub Pages
    runs-on: ubuntu-latest
    needs: [scope, codeql, ci]
    if: needs.scope.outputs.website == 'true' && !contains(github.ref_name, '-')
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
